---
- name: Gérer les VMs Proxmox Site 1 (existantes)
  hosts: localhost
  gather_facts: false
  collections:
    - community.general
  vars:
    target_site: "site1"
    
  tasks:
    # Assurer les specs des VMs existantes
    - name: Configurer pfSense Site 1
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site1.api_url }}"
        api_user: "{{ proxmox_site1.api_user }}"
        api_password: "{{ proxmox_site1.api_password }}"
        node: "{{ pfsense_s1_proxmox_node | default('pve-s1') }}"
        name: "{{ pfsense_s1_vm_name | default('s1-pfsense') }}"
        vmid: "{{ pfsense_s1_vmid | default(101) }}"
        memory: "{{ pfsense_s1_vm_memory | default(2048) }}"
        cores: "{{ pfsense_s1_vm_cores | default(2) }}"
        state: present
        update: yes  # applique seulement si différent

    - name: Configurer Services Site 1
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site1.api_url }}"
        api_user: "{{ proxmox_site1.api_user }}"
        api_password: "{{ proxmox_site1.api_password }}"
        node: "{{ services_s1_proxmox_node | default('pve-s1') }}"
        name: "{{ services_s1_vm_name | default('s1-services') }}"
        vmid: "{{ services_s1_vmid | default(102) }}"
        memory: "{{ services_s1_vm_memory | default(4096) }}"
        cores: "{{ services_s1_vm_cores | default(2) }}"
        state: present
        update: yes

    - name: Configurer Bastion Site 1
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site1.api_url }}"
        api_user: "{{ proxmox_site1.api_user }}"
        api_password: "{{ proxmox_site1.api_password }}"
        node: "{{ bastion_s1_proxmox_node | default('pve-s1') }}"
        name: "{{ bastion_s1_vm_name | default('s1-bastion') }}"
        vmid: "{{ bastion_s1_vmid | default(103) }}"
        memory: "{{ bastion_s1_vm_memory | default(2048) }}"
        cores: "{{ bastion_s1_vm_cores | default(2) }}"
        state: present
        update: yes

    # Démarrer toutes les VMs
    - name: Démarrer VMs Site 1
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site1.api_url }}"
        api_user: "{{ proxmox_site1.api_user }}"
        api_password: "{{ proxmox_site1.api_password }}"
        node: "{{ item.node | default('pve-s1') }}"
        name: "{{ item.name }}"
        state: started
      loop:
        - { name: "s1-pfsense" }
        - { name: "s1-services" }
        - { name: "s1-bastion" }

- name: Gérer les VMs Proxmox Site 2 (identique mais site2)