---
- name: Gérer les VMs Proxmox Site 1 (existantes)
  hosts: localhost
  gather_facts: false
  collections:
    - community.general
  vars:
    target_site: "site2"
    
  tasks:
    # Assurer les specs des VMs existantes
    - name: Configurer pfSense Site 2
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site2.api_url }}"
        api_user: "{{ proxmox_site2.api_user }}"
        api_password: "{{ proxmox_site2.api_password }}"
        node: "{{ pfsense_s2_proxmox_node | default('pve-s2') }}"
        name: "{{ pfsense_s2_vm_name | default('s2-pfsense') }}"
        vmid: "{{ pfsense_s2_vmid | default(101) }}"
        memory: "{{ pfsense_s2_vm_memory | default(2048) }}"
        cores: "{{ pfsense_s2_vm_cores | default(2) }}"
        state: present
        update: yes  # applique seulement si différent

    - name: Configurer Services Site 2
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site2.api_url }}"
        api_user: "{{ proxmox_site2.api_user }}"
        api_password: "{{ proxmox_site2.api_password }}"
        node: "{{ services_s2_proxmox_node | default('pve-s2') }}"
        name: "{{ services_s2_vm_name | default('s2-services') }}"
        vmid: "{{ services_s2_vmid | default(102) }}"
        memory: "{{ services_s2_vm_memory | default(4096) }}"
        cores: "{{ services_s2_vm_cores | default(2) }}"
        state: present
        update: yes

    - name: Configurer Bastion Site 2
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site2.api_url }}"
        api_user: "{{ proxmox_site2.api_user }}"
        api_password: "{{ proxmox_site2.api_password }}"
        node: "{{ bastion_s2_proxmox_node | default('pve-s2') }}"
        name: "{{ bastion_s2_vm_name | default('s2-bastion') }}"
        vmid: "{{ bastion_s2_vmid | default(103) }}"
        memory: "{{ bastion_s2_vm_memory | default(2048) }}"
        cores: "{{ bastion_s2_vm_cores | default(2) }}"
        state: present
        update: yes

    # Démarrer toutes les VMs
    - name: Démarrer VMs Site 2
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_site2.api_url }}"
        api_user: "{{ proxmox_site2.api_user }}"
        api_password: "{{ proxmox_site2.api_password }}"
        node: "{{ item.node | default('pve-s2') }}"
        name: "{{ item.name }}"
        state: started
      loop:
        - { name: "s2-pfsense" }
        - { name: "s2-services" }
        - { name: "s2-bastion" }